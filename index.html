<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>𝟗𝐗 𝐑𝐀𝐉𝐏𝐔𝐓 𝐀𝐑𝐌𝐘</title>
  <!-- Google Fonts & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
      overflow: hidden;
      position: relative;
    }

    /* Floating Universe Particles Effect */
    .stars-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .star {
      position: absolute;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(105vh) scale(0.6);
        opacity: 0;
      }
      50% {
        opacity: 0.9;
      }
      100% {
        transform: translateY(-10vh) scale(1.2);
        opacity: 0;
      }
    }

    /* Card Box with Classic Glow */
    .card {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 380px;
      background: rgba(18, 22, 34, 0.85);
      border-radius: 28px;
      padding: 30px 22px;
      text-align: center;
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 35px rgba(255, 45, 85, 0.25), 0 0 65px rgba(0, 150, 255, 0.15);
    }

    /* Live Badge */
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(46, 213, 115, 0.15);
      border: 1px solid rgba(46, 213, 115, 0.5);
      color: #2ed573;
      padding: 4px 14px;
      border-radius: 50px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 15px;
      box-shadow: 0 0 10px rgba(46, 213, 115, 0.35);
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background-color: #2ed573;
      border-radius: 50%;
      box-shadow: 0 0 8px #2ed573;
      animation: pulse 1.4s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(0.85); opacity: 0.5; }
      100% { transform: scale(1.3); opacity: 1; }
    }

    /* Dual Rotating Circles Around Logo */
    .logo-wrapper {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .ring-clockwise {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2.5px dashed #ff3838;
      animation: spinClockwise 9s linear infinite;
      box-shadow: 0 0 12px rgba(255, 56, 56, 0.4);
    }

    .ring-anticlockwise {
      position: absolute;
      width: 112%;
      height: 112%;
      border-radius: 50%;
      border: 2px dashed #00d2d3;
      animation: spinCounterClockwise 6s linear infinite;
      box-shadow: 0 0 12px rgba(0, 210, 211, 0.4);
    }

    @keyframes spinClockwise {
      100% { transform: rotate(360deg); }
    }

    @keyframes spinCounterClockwise {
      100% { transform: rotate(-360deg); }
    }

    .logo-img {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      position: relative;
      z-index: 2;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    /* Title & Subtitle */
    .title {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
    }

    .subtitle {
      font-size: 12px;
      font-weight: 700;
      color: #2ed573;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Features List Box */
    .features-box {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 16px;
      padding: 14px 16px;
      text-align: left;
      margin-bottom: 18px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #e0e0e0;
      font-size: 12.5px;
      margin-bottom: 10px;
      font-weight: 500;
    }

    .feature-item:last-child {
      margin-bottom: 0;
    }

    .feature-item i {
      color: #ff3838;
      font-size: 14px;
    }

    /* Timer Text */
    .timer-text {
      color: #a4b0be;
      font-size: 12px;
      margin-bottom: 18px;
    }

    .timer-text span {
      color: #ff3838;
      font-weight: 700;
      font-size: 14px;
    }

    /* Action Button */
    .join-btn {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      width: 100%;
      background: linear-gradient(135deg, #ff3838, #ff5e57);
      color: #fff;
      text-decoration: none;
      padding: 14px 0;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      box-shadow: 0 8px 25px rgba(255, 56, 56, 0.5);
      transition: all 0.3s ease;
    }

    .join-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(255, 56, 56, 0.7);
    }

    /* Managed By Footer */
    .managed-by {
      margin-top: 18px;
      font-size: 11px;
      color: #747d8c;
    }

    .managed-by a {
      color: #70a1ff;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }

    .managed-by a:hover {
      color: #1e90ff;
      text-decoration: underline;
    }
  </style>

  <!-- Animated Stars Background -->

  <!-- Landing Card -->

    <!-- Live Badge -->

    <!-- Animated Dual Ring Logo -->

    <!-- Title & Subtitle -->
    <h1 class="title">𝟗𝐗 𝐑𝐀𝐉𝐏𝐔𝐓 𝐀𝐑𝐌𝐘</h1>
    <p class="subtitle">🔥 99% ACCURATE COLOUR TRADING SIGNALS 🔥</p>

    <!-- Features -->
    <div class="features-box">
      <div class="feature-item">
        <i class="fa-solid fa-circle-check"></i>
        <span>Daily SureShot Color Prediction</span>
      </div>
      <div class="feature-item">
        <i class="fa-solid fa-circle-check"></i>
        <span>Loss Recovery Guaranteed Strategies</span>
      </div>
      <div class="feature-item">
        <i class="fa-solid fa-circle-check"></i>
        <span>100% VIP Free Predictions</span>
      </div>
    </div>

    <!-- Timer -->
    <p class="timer-text">Auto redirecting in <span id="timer">3</span> seconds...</p>

    <!-- Join Telegram Button -->

  </div>

  <script>
    // Universal floating stars generator
    const starsContainer = document.getElementById('starsContainer');
    const totalStars = 50;
    for (let i = 0; i < totalStars; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      const size = Math.random() * 3 + 1;
      star.style.width = `${size}px`;
      star.style.height = `${size}px`;
      star.style.left = `${Math.random() * 100}%`;
      star.style.animationDuration = `${Math.random() * 6 + 4}s`;
      star.style.animationDelay = `${Math.random() * 5}s`;
      starsContainer.appendChild(star);
    }

    // 5-second countdown & auto-redirect
    let timeLeft = 3;
    const timerElement = document.getElementById('timer');
    const targetUrl = "https://t.me/+IqPqUjpzvNE5NjE1";

    const countdown = setInterval(() => {
      timeLeft--;
      if (timerElement) {
        timerElement.textContent = timeLeft;
      }
      if (timeLeft <= 0) {
        clearInterval(countdown);
        window.location.href = targetUrl;
      }
    }, 1000);
  </script>
